name: golang-pipeline # Название

# Работает на пуш в main, и на любые теги
on: 
  push:
    branches: [ "main" ]
  tags: [ "*" ]

# Задачи
jobs:
  # Задача Тест
  test:
    runs-on: ubuntu-latest
    container: golang:1.26.1
    steps:
      - uses: actions/checkout@v7

      - name: Run Unit Tests
        run: |
          go mod download
          GOOS=linux GOARCH=amd64 go test -cover -timeout 30s ./...
      - name: Vet
        run: go vet ./...
    # Задача Деплой
  deploy: 
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    # Запуск только при добавление тега
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: pyromeow/tracker-finaly-12sprint

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}